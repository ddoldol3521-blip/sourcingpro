<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sellar 소싱 — 필터 & 엑셀 다운로드</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Sellar 소싱 필터</h1>
      <p class="sub">엑셀 업로드 → 프리셋(5개)으로 필터 → 네이버/쿠팡 시트 분리 다운로드 · 프리셋은 JSON 파일로만 보관합니다</p>
    </header>

    <section class="card upload-zone" id="dropZone">
      <label class="file-label">
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
        <span class="file-btn">엑셀 파일 선택</span>
        <span id="fileName" class="file-name">선택된 파일 없음</span>
      </label>
      <p id="sheetInfo" class="muted"></p>
    </section>

    <nav class="presets-nav" id="presetTabs" aria-label="프리셋"></nav>

    <section class="card filter-card" id="filterPanel">
      <h2 class="card-title">세부 필터 설정 — <span id="activePresetTitle">프리셋 1</span></h2>

      <div class="field">
        <label for="presetName">프리셋 이름</label>
        <input type="text" id="presetName" maxlength="40" />
      </div>

      <fieldset class="row">
        <legend>쇼핑성 키워드</legend>
        <label><input type="radio" name="shopping" value="all" checked /> 전체</label>
        <label><input type="radio" name="shopping" value="O" /> O</label>
        <label><input type="radio" name="shopping" value="X" /> X</label>
      </fieldset>

      <fieldset class="row">
        <legend>계절성 <span class="hint">(O = 있음, X = 없음)</span></legend>
        <label><input type="radio" name="season" value="all" checked /> 전체</label>
        <label><input type="radio" name="season" value="O" /> O</label>
        <label><input type="radio" name="season" value="X" /> X</label>
      </fieldset>

      <div class="grid-2">
        <div class="field">
          <label>작년 검색량 — 최소</label>
          <input type="number" id="lyMin" min="0" step="1" value="0" />
        </div>
        <div class="field">
          <label>작년 검색량 — 최대 <span class="hint">(0 = 무제한)</span></label>
          <input type="number" id="lyMax" min="0" step="1" value="0" />
        </div>
      </div>

      <fieldset class="months">
        <legend>작년 최대 검색월 <span class="hint">(선택 없음 = 전체)</span></legend>
        <div id="monthChecks" class="month-grid"></div>
      </fieldset>

      <div class="grid-2">
        <div class="field">
          <label>피크월 검색량 — 최소</label>
          <input type="number" id="peakMin" min="0" step="1" value="0" />
        </div>
        <div class="field">
          <label>피크월 검색량 — 최대 <span class="hint">(0 = 무제한)</span></label>
          <input type="number" id="peakMax" min="0" step="1" value="0" />
        </div>
      </div>

      <h3 class="section-label">쿠팡</h3>
      <div class="grid-2">
        <div class="field">
          <label>쿠팡 해외배송 비율 (%) — 최소</label>
          <input type="number" id="cpOverMin" min="0" max="100" step="0.1" value="0" />
        </div>
        <div class="field">
          <label>쿠팡 해외배송 비율 (%) — 최대 <span class="hint">(0 = 무제한)</span></label>
          <input type="number" id="cpOverMax" min="0" max="100" step="0.1" value="0" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>쿠팡 평균가 — 최소</label>
          <input type="number" id="cpPriceMin" min="0" step="1" value="0" />
        </div>
        <div class="field">
          <label>쿠팡 평균가 — 최대 <span class="hint">(0 = 무제한)</span></label>
          <input type="number" id="cpPriceMax" min="0" step="1" value="0" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>쿠팡 총 리뷰수 — 최소</label>
          <input type="number" id="cpRevMin" min="0" step="1" value="0" />
        </div>
        <div class="field">
          <label>쿠팡 총 리뷰수 — 최대 <span class="hint">(0 = 무제한)</span></label>
          <input type="number" id="cpRevMax" min="0" step="1" value="0" />
        </div>
      </div>

      <div class="actions">
        <button type="button" id="btnExportPresets" class="btn primary">프리셋보내기 (.json)</button>
        <label class="btn file-import-label">
          프리셋 가져오기
          <input type="file" id="presetImportInput" accept=".json,application/json" hidden />
        </label>
        <button type="button" id="btnApply" class="btn">필터 적용</button>
      </div>
    </section>

    <section class="card results" id="resultsSection" hidden>
      <h2 class="card-title">결과</h2>
      <p id="resultStats" class="stats"></p>
      <div class="actions">
        <button type="button" id="btnDownload" class="btn success">필터 결과 엑셀 다운로드 (전체 / 네이버 / 쿠팡)</button>
      </div>
    </section>

    <footer class="footer muted">
      첫 행이 헤더인 Sellar 소싱 형식(.xlsx)을 사용하세요. 쿠팡 해외배송 비율은 엑셀의 소수(0.35 = 35%)를 %로 입력합니다. 브라우저 저장(localStorage)은 사용하지 않습니다.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
